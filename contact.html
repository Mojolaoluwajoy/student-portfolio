<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Get in touch with [Your Name].">
  <title>Contact | [Your Name]</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">[Your Name]</a>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">&#9776;</button>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="planner.html">Planner</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Contact me</h1>
    <p>Have a question or want to work together? Send me a message.</p>
    <p>Email: <a href="mailto:you@example.com">you@example.com</a> &middot; GitHub: <a href="https://github.com/your-username">github.com/your-username</a></p>

    <form id="contact-form" class="form" novalidate>
      <p id="form-success" class="success-msg hidden">Thank you! Your message has been received.</p>

      <div class="form-group">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" autocomplete="name">
        <p class="error-msg" id="name-error"></p>
      </div>

      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" autocomplete="email">
        <p class="error-msg" id="email-error"></p>
      </div>

      <div class="form-group">
        <label for="phone">Phone number</label>
        <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="e.g. 08012345678">
        <p class="error-msg" id="phone-error"></p>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5"></textarea>
        <p class="error-msg" id="message-error"></p>
      </div>

      <button type="submit" class="btn">Send message</button>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> [Your Name] &middot; COS 106 Portfolio Project</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
